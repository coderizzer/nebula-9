<!DOCTYPE html>

<meta name="description" content="NEBULA//9 is a vertical arcade space shooter built with HTML5 Canvas and vanilla JavaScript. Keyboard and touch controls.">

<body>
<h1 class="sr">NEBULA//9</h1>
<p id="how" class="sr">A vertical arcade space shooter. Move with WASD or the arrow keys, fire with Space, pause with Escape. On touch screens, use the left thumb to move and the right thumb to fire.</p>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<canvas id="game" role="img" aria-label="NEBULA//9 game canvas" aria-describedby="how" tabindex="0"></canvas>
